<!DOCTYPE html>
<html lang="de">
<head>
  <base href="/BastardoLearning-/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Vokabeltrainer für Spanisch und Türkisch – offline, ohne Account.">
  <meta name="theme-color" content="#2E7D6B">

  <!-- iOS: als Web-App vom Home-Bildschirm -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Barstardo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Barstardo Learning</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #F4FAF7; }
    @media (prefers-color-scheme: dark) { body { background: #0F1513; } }
    #loading { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; font: 16px -apple-system, system-ui, sans-serif;
      color: #2E7D6B; }
  </style>
</head>
<body>
  <div id="loading">Barstardo Learning wird geladen …</div>
  <script>
    // Offline-Unterstützung: alle Dateien beim ersten Besuch speichern.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('offline_sw.js').catch(function (e) {
          console.warn('Service Worker nicht registriert:', e);
        });
      });
    }
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
